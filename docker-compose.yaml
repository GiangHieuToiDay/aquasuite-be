services:
  redis:
    image: redis:7.2-alpine
    container_name: aquasuite-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be provided and non-empty}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be provided and non-empty}
    networks:
      - aquasuite-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be provided and non-empty}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

networks:
  aquasuite-network:
    driver: bridge
