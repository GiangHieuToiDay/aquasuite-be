
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: aquasuite-be

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/aquasuite}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}

    properties:
      hibernate:
        default_schema: public
        format_sql: true

        jdbc:
          batch_size: 50
          batch_versioned_data: true

        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: public
    locations: classpath:db/migration


  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


aquasuite:
  config:
    environment: default
    auth-generation: 2
  iam:
    dev-seed:
      enabled: false
  security:
    jwt:
      issuer: aquasuite-be
      access-audience: aquasuite-api
      refresh-audience: aquasuite-auth
      access-token-ttl-seconds: 1800
      refresh-token-ttl-seconds: 1296000
      session-absolute-ttl-seconds: 1296000
      secret: ${JWT_SECRET:}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

