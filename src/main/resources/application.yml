
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: aquasuite-be

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aquasuite}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
#      ddl-auto: ${JPA_DDL_AUTO:create}

    properties:
      hibernate:
        default_schema: public
        format_sql: true

        jdbc:
          batch_size: 50
          batch_versioned_data: true

        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    schemas: public
    locations: classpath:db/migration


  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
#      host: ${SPRING_DATA_REDIS_HOST:${SPRING_REDIS_HOST:localhost}}
      #      port: ${SPRING_DATA_REDIS_PORT:${SPRING_REDIS_PORT:6379}}
      #      password: ${SPRING_DATA_REDIS_PASSWORD:${SPRING_REDIS_PASSWORD:}}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


aquasuite:
  config:
    environment: default
    auth-generation: 2
  security:
    jwt:
      issuer: aquasuite-be
      access-audience: aquasuite-api
      refresh-audience: aquasuite-auth
      access-token-ttl-seconds: 1800
      refresh-token-ttl-seconds: 1296000
      session-absolute-ttl-seconds: 1296000
      secret: ${JWT_SECRET:}
