
server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import:
      - optional:classpath:application-local.yml
      - optional:file:./src/main/resources/application-local.yml
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
  application:
    name: aquasuite-be

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aquasuite}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}

    properties:
      hibernate:
        default_schema: public
        format_sql: true

        jdbc:
          batch_size: 50
          batch_versioned_data: true

        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: true
    schemas: public
    locations: classpath:db/migration


  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


aquasuite:
  config:
    environment: default
    auth-generation: 2
  iam:
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:}
    dev-seed:
      enabled: false
  security:
    jwt:
      issuer: aquasuite-be
      access-audience: aquasuite-api
      refresh-audience: aquasuite-auth
      access-token-ttl-seconds: 1800
      refresh-token-ttl-seconds: 1296000
      session-absolute-ttl-seconds: 1296000
      secret: ${JWT_SECRET:}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

minio:
  endpoint: ${MINIO_ENDPOINT:}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: ${MINIO_BUCKET:aquasuite-private}

payos:
  base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
  client-id: ${PAYOS_CLIENT_ID:}
  api-key: ${PAYOS_API_KEY:}
  checksum-key: ${PAYOS_CHECKSUM_KEY:}
  return-url: ${PAYOS_RETURN_URL:http://localhost:5173/checkout/result}
  cancel-url: ${PAYOS_CANCEL_URL:http://localhost:5173/checkout/result}
  override-amount: ${PAYOS_OVERRIDE_AMOUNT:}


