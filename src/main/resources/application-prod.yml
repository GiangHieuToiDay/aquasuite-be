spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${SPRING_REDIS_HOST}}
      port: ${SPRING_DATA_REDIS_PORT:${SPRING_REDIS_PORT:6379}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${SPRING_REDIS_PASSWORD:}}
      ssl:
        enabled: ${SPRING_REDIS_SSL_ENABLED:true}

aquasuite:
  config:
    environment: prod
    auth-generation: 2
  iam:
    dev-seed:
      enabled: false
  security:
    jwt:
      secret: ${JWT_SECRET:}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
